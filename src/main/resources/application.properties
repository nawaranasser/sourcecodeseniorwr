
# =========================================================
# Database Configuration
# Values are injected at container runtime
# =========================================================
jdbc.driverClassName=${JDBC_DRIVER_CLASS:com.mysql.cj.jdbc.Driver}
jdbc.url=${JDBC_URL}
jdbc.username=${DB_USER}
jdbc.password=${DB_PASSWORD}

# =========================================================
# Memcached Configuration
# =========================================================
memcached.active.host=${MEMCACHED_ACTIVE_HOST:cache}
memcached.active.port=${MEMCACHED_ACTIVE_PORT:11211}

memcached.standBy.host=${MEMCACHED_STANDBY_HOST:cache}
memcached.standBy.port=${MEMCACHED_STANDBY_PORT:11211}

# =========================================================
# RabbitMQ Configuration
# =========================================================
rabbitmq.address=${RABBITMQ_HOST:rabbitmq}
rabbitmq.port=${RABBITMQ_PORT:5672}
rabbitmq.username=${RABBITMQ_USER}
rabbitmq.password=${RABBITMQ_PASSWORD}

# =========================================================
# Elasticsearch Configuration
# =========================================================
elasticsearch.host=${ELASTICSEARCH_HOST:elasticsearch}
elasticsearch.port=${ELASTICSEARCH_PORT:9300}
elasticsearch.cluster=${ELASTICSEARCH_CLUSTER:vprofile}
elasticsearch.node=${ELASTICSEARCH_NODE:vprofilenode}
